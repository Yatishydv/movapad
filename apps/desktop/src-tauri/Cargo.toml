[package]
name = "movapad-desktop"
version = "0.1.0"
description = "MovaPad — Your phone. Your touchpad."
authors = ["MovaPad"]
license = "Proprietary"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Networking (Phase 1: WebSocket for local dev)
tokio-tungstenite = "0.27"
futures-util = "0.3"

# Cryptography (for device identity)
rand = "0.9"
webrtc = "0.11"

# macOS input (Core Graphics)
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"

# Windows input (Win32 API)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }
